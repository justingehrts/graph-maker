<!doctype html>
<html><head><meta charset="utf-8"><title>Station basemap preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<style>
 body{margin:0;font:14px system-ui} #map{position:absolute;inset:0}
 #bar{position:absolute;z-index:2;top:10px;left:10px;background:#fffd;padding:8px;border-radius:6px;display:flex;gap:6px}
</style></head><body>
<div id="bar"><input id="tok" placeholder="Mapbox public token (pk...)" size="34">
<button id="go">Load</button><button data-v="wide">Wide (Ohio)</button><button data-v="tight">Tight (US-33 / SR-104)</button></div>
<div id="map"></div>
<script>
const views={wide:{center:[-82.8,40.3],zoom:6.4},tight:{center:[-82.93,39.89],zoom:12.6}};
let map;
document.getElementById('go').onclick=async()=>{
  mapboxgl.accessToken=document.getElementById('tok').value.trim();
  const style=await (await fetch('station-basemap.json')).json();
  map=new mapboxgl.Map({container:'map',style,...views.wide});
};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>map&&map.jumpTo(views[b.dataset.v]));
</script></body></html>
